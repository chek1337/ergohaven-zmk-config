parse_config:
  zmk_remove_keycode_prefix:
    - "RU_"
    - "EN_"

  zmk_combos:
    cmben: {align: top, offset: 0.2}
    cmbru: {align: top, offset: 0.2}
    russian_ha: {align: top, offset: 0.2}
    russian_tverd_znak: {align: top, offset: 0.5}
    capslock_one_word: {align: bottom, offset: 0.2}
    caps: {align: bottom, offset: 0.5}
    alt_tab: {align: bottom, offset: 0.4}
    window_mode_nvim: {align: bottom, offset: 0.6}
    tmux_focus: {align: bottom, offset: 0.8}
    ctrl_shift_v_ru: {align: bottom, offset: 0.3}
    ctrl_shift_v_en: {align: bottom, offset: 0.3}
    ctrl_shift_c_ru: {align: bottom, offset: 0.5}
    ctrl_shift_c_en: {align: bottom, offset: 0.5}

  zmk_keycode_map:
    CYRILLIC_A: А
    CYRILLIC_BE: Б
    CYRILLIC_VE: В
    CYRILLIC_GHE: Г
    CYRILLIC_DE: Д
    CYRILLIC_IE: Е
    CYRILLIC_IO: Ё
    CYRILLIC_ZHE: Ж
    CYRILLIC_ZE: З
    CYRILLIC_I: И
    CYRILLIC_SHORT_I: Й
    CYRILLIC_KA: К
    CYRILLIC_EL: Л
    CYRILLIC_EM: М
    CYRILLIC_EN: Н
    CYRILLIC_O: О
    CYRILLIC_PE: П
    CYRILLIC_ER: Р
    CYRILLIC_ES: С
    CYRILLIC_TE: Т
    CYRILLIC_U: У
    CYRILLIC_EF: Ф
    CYRILLIC_HA: Х
    CYRILLIC_TSE: Ц
    CYRILLIC_CHE: Ч
    CYRILLIC_SHA: Ш
    CYRILLIC_SHCHA: Щ
    CYRILLIC_HARD_SIGN: Ъ
    CYRILLIC_YERU: Ы
    CYRILLIC_SOFT_SIGN: Ь
    CYRILLIC_E: Э
    CYRILLIC_YU: Ю
    CYRILLIC_YA: Я

    DQT: '"'
    SQT: "'"
    FSLH: "/"
    BACKSLASH: "\\"
    QMARK: "?"
    COMMA: ","
    DOT: "."
    EXCL: "!"
    PRCNT: "%"
    LPAR: "("
    RPAR: ")"
    LBKT: "["
    RBKT: "]"
    UNDER: _
    EQUAL: "="
    MINUS: "-"
    PLUS: "+"
    ASTERISK: "*"
    AMPERSAND: "&"
    DOLLAR: $
    AT: "@"
    HASH: "#"
    PIPE: "|"
    CARET: "^"
    TILDE: "~"
    GRAVE: "`"
    LESS_THAN: <
    GREATER_THAN: ">"
    LEFT_BRACE: "{"
    RIGHT_BRACE: "}"

draw_config:
  draw_key_sides: false

  key_h: 64
  key_rx: 4
  key_ry: 4

  line_spacing: 1

  combo_w: 30
  combo_h: 30

  small_pad: 4

  inner_pad_w: 2
  inner_pad_h: 2
  outer_pad_w: 0
  outer_pad_h: 0

  append_colon_to_layer_header: false
  shrink_wide_legends: 5

  glyph_tap_size: 22
  glyph_hold_size: 16
  glyph_shifted_size: 16

  svg_style: |
    svg path {
        fill: inherit;
    }

    svg.keymap {
        --color--material--blue-gray--50: rgb(236, 239, 241);
        --color--material--blue-gray--100: rgb(207, 216, 220);
        --color--material--blue-gray--200: rgb(176, 190, 197);
        --color--material--blue-gray--300: rgb(144, 164, 174);
        --color--material--blue-gray--400: rgb(120, 144, 156);
        --color--material--blue-gray--500: rgb(96, 125, 139);
        --color--material--blue-gray--600: rgb(84, 110, 122);
        --color--material--blue-gray--700: rgb(69, 90, 100);
        --color--material--blue-gray--800: rgb(55, 71, 79);
        --color--material--blue-gray--900: rgb(38, 50, 56);

        --color--bg: transparent;
        --color--text: var(--color--material--blue-gray--900);

        --color--layer--text: var(--color--material--blue-gray--400);

        --color--key--bg: var(--color--material--blue-gray--50);
        --color--key--border: white;
        --color--key--text--tap: var(--color--text);
        --color--key--text--shifted: var(--color--material--blue-gray--400);
        --color--key--text--hold: var(--color--material--blue-gray--400);

        --color--combo--bg: var(--color--material--blue-gray--100);
        --color--combo--border: var(--color--combo--bg);
        --color--combo--dendron: var(--color--combo--border);
        --color--combo--text--tap: var(--color--material--blue-gray--800);
        --color--combo--text--shifted: var(--color--material--blue-gray--400);
        --color--combo--text--hold: var(--color--combo--text--tap);

        font-family: system-ui, "Noto Sans", "Segoe UI", sans-serif;
        font-size: 18px;
        font-weight: 600;
        font-kerning: normal;
        text-rendering: optimizeLegibility;
        fill: var(--color--text);
        background-color: var(--color--bg);
    }

    rect,
    path {
      shape-rendering: geometricPrecision;
    }

    text {
        text-anchor: middle;
        dominant-baseline: middle;
        line-height: 1;
    }

    text.label {
        font-size: 32px;
        text-anchor: start;
        paint-order: stroke;
        fill: var(--color--layer--text);
    }

    rect.key,
    rect.combo {
        fill: var(--color--key--bg);
        stroke: var(--color--key--border);
    }
    .tap {
      fill: var(--color--key--text--tap);
    }
    .shifted,
    .hold {
        font-size: 14px;
        text-anchor: middle;
    }
    .shifted {
        fill: var(--color--key--text--shifted);
    }
    .hold {
        fill: var(--color--key--text--hold);
    }

    .combo {
      --color--key--bg: var(--color--combo--bg);
      --color--key--border: var(--color--combo--border);
      --color--key--text--tap: var(--color--combo--text--tap);
      --color--key--text--shifted: var(--color--combo--text--shifted);
      --color--key--text--hold: var(--color--combo--text--hold);
    }
    rect.combo {
      opacity: 0.8;
      stroke-width: 0;
    }
    path.combo {
      stroke-width: 1;
      stroke: var(--color--combo--dendron);
      fill: none;
    }
    .combo.tap {
      font-size: 14px;
    }
    .combo.shifted {
      font-size: 11px;
    }
    .combo.hold {
      font-size: 14px;
    }

    .trans,
    .none,
    .ghost {
      opacity: 0.4;
    }
