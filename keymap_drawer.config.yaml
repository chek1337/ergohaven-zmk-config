parse_config:
  zmk_remove_keycode_prefix:
    - "RU_"
    - "EN_"

  zmk_combos:
    cmben: {align: top, offset: 0.2}
    cmbru: {align: top, offset: 0.2}
    capslock_one_word: {align: top, offset: 0.2}
    caps: {align: bottom, offset: 0.00}
    # window_mode_nvim: {align: bottom, offset: 0.55}
    # alt_tab: {align: bottom, offset: 0.4}
    # tmux_focus: {align: bottom, offset: 0.9}
    ctrl_shift_v_ru: {align: bottom, offset: 0.5}
    ctrl_shift_v_en: {align: bottom, offset: 0.5}
    ctrl_shift_c_ru: {align: bottom, offset: 0.0}
    ctrl_shift_c_en: {align: bottom, offset: 0.0}

  raw_binding_map:
    "&none": {type: ghost}
    "&bootloader": {tap: $$mdi:progress-download$$}
    "&studio_unlock": {tap: $$mdi:lock-open$$}
    "&en GRAVE":        {tap: "`", hold: en}
    "&en LESS_THAN":    {tap: "<", hold: en}
    "&en GREATER_THAN": {tap: ">", hold: en}
    "&en SQT":          {tap: "'", hold: en}
    "&en TILDE":        {tap: "~", hold: en}
    "&en AMPERSAND":    {tap: "&", hold: en}
    "&en LEFT_BRACE":   {tap: "{", hold: en}
    "&en RIGHT_BRACE":  {tap: "}", hold: en}
    "&en HASH":         {tap: "#", hold: en}
    "&en PIPE":         {tap: "|", hold: en}
    "&en AT":           {tap: "@", hold: en}
    "&en DOLLAR":       {tap: "$", hold: en}
    "&en LBKT":         {tap: "[", hold: en}
    "&en RBKT":         {tap: "]", hold: en}
    "&en SEMICOLON":    {tap: ";", hold: en}
    "&en COLON":        {tap: ":", hold: en}
    "&en COMMA":        {tap: ",", hold: en}
    "&en CARET":        {tap: "^", hold: en}
    "&en DOT":          {tap: ".", hold: en}
    "&en LS(LC(V))":    {tap: $$mdi:content-paste$$, hold: en}
    "&en LS(LC(C))":    {tap: $$mdi:content-copy$$, hold: en}
    "&kp LS(LC(V))": $$mdi:content-paste$$
    "&kp LS(LC(C))": $$mdi:content-copy$$
    "&kp RS(ENTER)":  {tap: $$mdi:keyboard-return$$,          hold: $$mdi:apple-keyboard-shift$$}
    "&kp RC(DELETE)": {tap: $$mdi:backspace-reverse-outline$$, hold: $$mdi:apple-keyboard-control$$}
    "&kp RC(BSPC)":   {tap: $$mdi:backspace$$,                hold: $$mdi:apple-keyboard-control$$, type: backspace}
    "&kp LA(TAB)":    {tap: $$mdi:keyboard-tab$$,             hold: $$mdi:apple-keyboard-option$$}
    "&kp LC(SPACE)":  {tap: $$mdi:keyboard-space$$,           hold: $$mdi:apple-keyboard-control$$}
    "&kp LC(W)":      {tap: "W",                              hold: $$mdi:apple-keyboard-control$$}
    "&layer_en": {tap: $$mdi:translate$$, hold: en}
    "&layer_ru": {tap: $$mdi:translate$$, hold: ru}
    "&caps_word": $$mdi:caps-lock$$
    "&mkp MB1": $$mdi:mouse-left-click$$
    "&mkp MB2": $$mdi:mouse-right-click$$
    "&mkp MB3": $$mdi:mouse-scroll-wheel$$

  zmk_keycode_map:
    LSHIFT: $$mdi:apple-keyboard-shift$$
    LSHFT: $$mdi:apple-keyboard-shift$$
    RSHIFT: $$mdi:apple-keyboard-shift$$
    RSHFT: $$mdi:apple-keyboard-shift$$
    LEFT_SHIFT: $$mdi:apple-keyboard-shift$$
    RIGHT_SHIFT: $$mdi:apple-keyboard-shift$$
    LCTRL: $$mdi:apple-keyboard-control$$
    RCTRL: $$mdi:apple-keyboard-control$$
    LALT: $$mdi:apple-keyboard-option$$
    LEFT_ALT: $$mdi:apple-keyboard-option$$
    RIGHT_ALT: $$mdi:apple-keyboard-option$$
    LGUI: $$mdi:apple-keyboard-command$$
    LEFT_GUI: $$mdi:apple-keyboard-command$$
    RGUI: $$mdi:apple-keyboard-command$$
    RIGHT_GUI: $$mdi:apple-keyboard-command$$

    UP: $$mdi:arrow-up-bold$$
    DOWN: $$mdi:arrow-down-bold$$
    LEFT: $$mdi:arrow-left-bold$$
    RIGHT: $$mdi:arrow-right-bold$$
    PG_UP: $$mdi:transfer-up$$
    PG_DN: $$mdi:transfer-down$$
    PAGE_UP: $$mdi:transfer-up$$
    PAGE_DOWN: $$mdi:transfer-down$$
    HOME: $$mdi:arrow-collapse-left$$
    END: $$mdi:arrow-collapse-right$$

    SPACE: $$mdi:keyboard-space$$
    TAB: $$mdi:keyboard-tab$$
    ENTER: $$mdi:keyboard-return$$
    RET: $$mdi:keyboard-return$$
    ESC: $$mdi:keyboard-esc$$
    ESCAPE: $$mdi:keyboard-esc$$
    BSPC:
      type: backspace
      tap: $$mdi:backspace$$
    BACKSPACE:
      type: backspace
      tap: $$mdi:backspace$$
    DEL: $$mdi:backspace-reverse-outline$$
    DELETE: $$mdi:backspace-reverse-outline$$

    CAPS: $$mdi:apple-keyboard-caps$$
    CAPSLOCK: $$mdi:apple-keyboard-caps$$
    PRINTSCREEN: $$mdi:printer$$
    PSCRN: $$mdi:printer$$

    C_MUTE: $$mdi:volume-off$$
    C_VOL_UP: $$mdi:volume-high$$
    C_VOL_DN: $$mdi:volume-low$$
    C_NEXT: $$mdi:skip-next$$
    C_PREV: $$mdi:skip-previous$$
    C_PP: $$mdi:play-pause$$
    C_PLAY_PAUSE: $$mdi:play-pause$$

    BT_CLR: $$mdi:bluetooth-off$$
    BT_SEL: $$mdi:bluetooth-connect$$
    OUT_BLE: $$mdi:bluetooth$$
    OUT_USB: $$mdi:usb$$

    CYRILLIC_A: А
    CYRILLIC_BE: Б
    CYRILLIC_VE: В
    CYRILLIC_GHE: Г
    CYRILLIC_DE: Д
    CYRILLIC_IE: Е
    CYRILLIC_IO: Ё
    CYRILLIC_ZHE: Ж
    CYRILLIC_ZE: З
    CYRILLIC_I: И
    CYRILLIC_SHORT_I: Й
    CYRILLIC_KA: К
    CYRILLIC_EL: Л
    CYRILLIC_EM: М
    CYRILLIC_EN: Н
    CYRILLIC_O: О
    CYRILLIC_PE: П
    CYRILLIC_ER: Р
    CYRILLIC_ES: С
    CYRILLIC_TE: Т
    CYRILLIC_U: У
    CYRILLIC_EF: Ф
    CYRILLIC_HA: Х
    CYRILLIC_TSE: Ц
    CYRILLIC_CHE: Ч
    CYRILLIC_SHA: Ш
    CYRILLIC_SHCHA: Щ
    CYRILLIC_HARD_SIGN: Ъ
    CYRILLIC_YERU: Ы
    CYRILLIC_SOFT_SIGN: Ь
    CYRILLIC_E: Э
    CYRILLIC_YU: Ю
    CYRILLIC_YA: Я

    DQT: '"'
    SQT: "'"
    FSLH: "/"
    BACKSLASH: "\\"
    QMARK: "?"
    COMMA: ","
    DOT: "."
    EXCL: "!"
    PRCNT: "%"
    LPAR: "("
    RPAR: ")"
    LBKT: "["
    RBKT: "]"
    UNDER: _
    EQUAL: "="
    MINUS: "-"
    PLUS: "+"
    ASTERISK: "*"
    AMPERSAND: "&"
    DOLLAR: $
    AT: "@"
    HASH: "#"
    PIPE: "|"
    CARET: "^"
    TILDE: "~"
    GRAVE: "`"
    LESS_THAN: <
    GREATER_THAN: ">"
    LEFT_BRACE: "{"
    RIGHT_BRACE: "}"
    COLON: ":" 
    SEMICOLON:
      tap: ";"
      shifted: ":"

draw_config:
  draw_key_sides: false

  key_h: 64
  key_rx: 4
  key_ry: 4

  line_spacing: 1

  combo_w: 40
  combo_h: 40

  small_pad: 4

  inner_pad_w: 2
  inner_pad_h: 2
  outer_pad_w: 0
  outer_pad_h: 40

  append_colon_to_layer_header: false
  shrink_wide_legends: 5

  glyph_tap_size: 22
  glyph_hold_size: 16
  glyph_shifted_size: 16

  svg_style: |
    svg path {
        fill: inherit;
    }

    svg.keymap {
        /* GitHub Primer neutrals (canvas / border / fg) */
        --color--material--blue-gray--50: #f6f8fa;
        --color--material--blue-gray--100: #eaeef2;
        --color--material--blue-gray--200: #d0d7de;
        --color--material--blue-gray--300: #afb8c1;
        --color--material--blue-gray--400: #656d76;
        --color--material--blue-gray--500: #57606a;
        --color--material--blue-gray--600: #424a53;
        --color--material--blue-gray--700: #32383f;
        --color--material--blue-gray--800: #24292f;
        --color--material--blue-gray--900: #1f2328;

        /* GitHub Primer accent blue (replaces teal accent for F/J) */
        --color--material--teal--50: #ddf4ff;
        --color--material--teal--100: #b6e3ff;
        --color--material--teal--200: #80ccff;
        --color--material--teal--300: #54aeff;
        --color--material--teal--400: #218bff;
        --color--material--teal--500: #0969da;

        --color--bg: transparent;
        --color--text: var(--color--material--blue-gray--900);

        --color--layer--text: var(--color--material--blue-gray--400);

        --color--key--bg: var(--color--material--blue-gray--50);
        --color--key--border: white;
        --color--key--text--tap: var(--color--text);
        --color--key--text--shifted: var(--color--material--blue-gray--400);
        --color--key--text--hold: var(--color--material--blue-gray--400);

        --color--combo--bg: var(--color--material--blue-gray--100);
        --color--combo--border: var(--color--combo--bg);
        --color--combo--dendron: var(--color--material--blue-gray--400);
        --color--combo--text--tap: var(--color--material--blue-gray--800);
        --color--combo--text--shifted: var(--color--material--blue-gray--400);
        --color--combo--text--hold: var(--color--combo--text--tap);

        font-family: system-ui, "Noto Sans", "Segoe UI", sans-serif;
        font-size: 18px;
        font-weight: 600;
        font-kerning: normal;
        text-rendering: optimizeLegibility;
        fill: var(--color--text);
        background-color: var(--color--bg);
    }

    rect,
    path {
      shape-rendering: geometricPrecision;
    }

    text {
        text-anchor: middle;
        dominant-baseline: middle;
        line-height: 1;
    }

    text.label {
        font-size: 32px;
        text-anchor: start;
        paint-order: stroke;
        fill: var(--color--layer--text);
    }

    rect.key,
    rect.combo {
        fill: var(--color--key--bg);
        stroke: var(--color--key--border);
    }
    .tap {
      fill: var(--color--key--text--tap);
    }
    .shifted,
    .hold {
        font-size: 14px;
        text-anchor: middle;
    }
    .shifted {
        dominant-baseline: hanging;
        fill: var(--color--key--text--shifted);
        translate: 22px 2px;
    }
    .hold {
        dominant-baseline: ideographic;
        fill: var(--color--key--text--hold);
        translate: 22px 4px;
    }

    .keypos-0 .shifted, .keypos-1 .shifted, .keypos-2 .shifted,
    .keypos-3 .shifted, .keypos-4 .shifted, .keypos-5 .shifted,
    .keypos-12 .shifted, .keypos-13 .shifted, .keypos-14 .shifted,
    .keypos-15 .shifted, .keypos-16 .shifted, .keypos-17 .shifted,
    .keypos-24 .shifted, .keypos-25 .shifted, .keypos-26 .shifted,
    .keypos-27 .shifted, .keypos-28 .shifted, .keypos-29 .shifted,
    .keypos-36 .shifted, .keypos-37 .shifted, .keypos-38 .shifted,
    .keypos-39 .shifted, .keypos-40 .shifted {
        translate: -22px 2px;
    }

    .keypos-0 .hold, .keypos-1 .hold, .keypos-2 .hold,
    .keypos-3 .hold, .keypos-4 .hold, .keypos-5 .hold,
    .keypos-12 .hold, .keypos-13 .hold, .keypos-14 .hold,
    .keypos-15 .hold, .keypos-16 .hold, .keypos-17 .hold,
    .keypos-24 .hold, .keypos-25 .hold, .keypos-26 .hold,
    .keypos-27 .hold, .keypos-28 .hold, .keypos-29 .hold,
    .keypos-36 .hold, .keypos-37 .hold, .keypos-38 .hold,
    .keypos-39 .hold, .keypos-40 .hold {
        translate: -22px 4px;
    }

    .keypos-16 .key,
    .keypos-19 .key {
        --color--key--bg: var(--color--material--teal--200);
        --color--key--border: var(--color--material--teal--100);
        --color--key--text--shifted: var(--color--key--text--tap);
        --color--key--text--hold: var(--color--key--text--tap);
    }

    .keypos-38 .key, .keypos-39 .key, .keypos-40 .key,
    .keypos-41 .key, .keypos-42 .key {
        --color--key--bg: var(--color--material--blue-gray--100);
        --color--key--border: var(--color--material--blue-gray--50);
    }

    .combo {
      --color--key--bg: var(--color--combo--bg);
      --color--key--border: var(--color--combo--border);
      --color--key--text--tap: var(--color--combo--text--tap);
      --color--key--text--shifted: var(--color--combo--text--shifted);
      --color--key--text--hold: var(--color--combo--text--hold);
    }
    rect.combo {
      opacity: 0.8;
      stroke-width: 0;
    }
    path.combo {
      stroke-width: 1;
      stroke: var(--color--combo--dendron);
      fill: none;
      opacity: 0.5;
    }
    .combo.tap {
      font-size: 14px;
    }
    .combo.shifted,
    .combo.hold {
      font-size: 12px;
    }
    /* default (fallback for new combos): center-bottom / center-top */
    .combo.shifted { translate: 0 -13px; }
    .combo.hold    { translate: 0 13px; }

    /* left-half combos: corner-left (mirror of home-row left side) */
    .combopos-0 .hold, .combopos-1 .hold, .combopos-2 .hold,
    .combopos-3 .hold, .combopos-4 .hold, .combopos-5 .hold,
    .combopos-6 .hold, .combopos-7 .hold, .combopos-10 .hold {
        translate: -11px 4px;
    }
    .combopos-0 .shifted, .combopos-1 .shifted, .combopos-2 .shifted,
    .combopos-3 .shifted, .combopos-4 .shifted, .combopos-5 .shifted,
    .combopos-6 .shifted, .combopos-7 .shifted, .combopos-10 .shifted {
        translate: -11px -2px;
    }

    /* right-half combos: corner-right */
    .combopos-8 .hold, .combopos-9 .hold {
        translate: 11px 4px;
    }
    .combopos-8 .shifted, .combopos-9 .shifted {
        translate: 11px -2px;
    }

    .trans,
    .none,
    .ghost {
      opacity: 0.4;
    }
